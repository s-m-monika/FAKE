# nginx config for the QuickDrop SPA on Cloud Run.
# Rendered from this template by nginx:alpine's envsubst entrypoint so that
# ${PORT} (provided by Cloud Run) is substituted at container start.

server {
    listen       ${PORT};
    listen       [::]:${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip static text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- PWA: never cache the entry, service worker, or manifest ----------
    # These must always be revalidated so new deploys propagate immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Workbox runtime helper — keep it revalidated alongside the SW.
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ---- Hashed static assets: safe to cache aggressively -----------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA routing ------------------------------------------------------
    # Any unknown path (e.g. /onboarding/verify) falls back to index.html so
    # client-side routing and hard refreshes work instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening.
    server_tokens off;
}
